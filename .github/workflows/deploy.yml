name: Deploy to AWS (ECS Fargate, manual)

# Requires repository variables (Settings → Secrets and variables → Actions → Variables);
# `terraform output github_actions_variables` prints them all.
# Manual only: pushes to main deploy to EC2 via deploy-ec2.yml. Switch the trigger to
# `push: branches: [main]` here (and remove it from deploy-ec2.yml) if you move to ECS.
on:
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write # GitHub OIDC → AWS, no stored AWS keys

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: ci
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ vars.APP_URL }}
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
      ECS_CLUSTER: ${{ vars.ECS_CLUSTER }}
      ECS_SERVICE: ${{ vars.ECS_SERVICE }}
      APP_TASK_FAMILY: ${{ vars.APP_TASK_FAMILY }}
      MIGRATE_TASK_FAMILY: ${{ vars.MIGRATE_TASK_FAMILY }}
      TAG: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - uses: docker/setup-buildx-action@v3

      - name: Build and push images
        env:
          REPO: ${{ steps.ecr.outputs.registry }}/${{ vars.ECR_REPOSITORY }}
        run: |
          docker buildx build --platform linux/amd64 --target runner  -t "$REPO:$TAG"         --push .
          docker buildx build --platform linux/amd64 --target migrator -t "$REPO:migrate-$TAG" --push .
          echo "IMAGE=$REPO:$TAG" >> "$GITHUB_ENV"
          echo "MIGRATE_IMAGE=$REPO:migrate-$TAG" >> "$GITHUB_ENV"

      - name: Run database migrations (one-off ECS task)
        run: |
          set -euo pipefail
          # New migrate task definition revision pointing at this commit's migrator image.
          aws ecs describe-task-definition --task-definition "$MIGRATE_TASK_FAMILY" --query taskDefinition > td.json
          jq --arg img "$MIGRATE_IMAGE" '.containerDefinitions[0].image = $img
            | del(.taskDefinitionArn, .revision, .status, .requiresAttributes, .compatibilities, .registeredAt, .registeredBy)' td.json > td-new.json
          TD_ARN=$(aws ecs register-task-definition --cli-input-json file://td-new.json --query taskDefinition.taskDefinitionArn --output text)
          TASK_ARN=$(aws ecs run-task --cluster "$ECS_CLUSTER" --launch-type FARGATE --task-definition "$TD_ARN" \
            --network-configuration "awsvpcConfiguration={subnets=[${{ vars.TASK_SUBNETS }}],securityGroups=[${{ vars.TASK_SECURITY_GROUP }}],assignPublicIp=${{ vars.ASSIGN_PUBLIC_IP }}}" \
            --query 'tasks[0].taskArn' --output text)
          echo "Migration task: $TASK_ARN"
          aws ecs wait tasks-stopped --cluster "$ECS_CLUSTER" --tasks "$TASK_ARN"
          EXIT=$(aws ecs describe-tasks --cluster "$ECS_CLUSTER" --tasks "$TASK_ARN" --query 'tasks[0].containers[0].exitCode' --output text)
          echo "Migration exit code: $EXIT"
          test "$EXIT" = "0"

      - name: Render app task definition
        run: |
          aws ecs describe-task-definition --task-definition "$APP_TASK_FAMILY" --query taskDefinition > app-td.json

      - id: render
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: app-td.json
          container-name: app
          image: ${{ env.IMAGE }}

      - name: Deploy to ECS (rolling, circuit breaker rolls back on failure)
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.render.outputs.task-definition }}
          cluster: ${{ vars.ECS_CLUSTER }}
          service: ${{ vars.ECS_SERVICE }}
          wait-for-service-stability: true

      - name: Verify health through the public URL
        run: |
          for i in $(seq 1 20); do
            if curl -sf "${{ vars.APP_URL }}/api/health"; then exit 0; fi
            sleep 6
          done
          echo "Health check failed" && exit 1

name: Build (CodeBuild) and deploy to EC2

# push to main → CI → CodeBuild pulls this exact commit from GitHub (AWS CodeConnections),
# builds the images and pushes them to ECR
# → SSM Run Command on the EC2 instance runs /opt/cloudops/deploy.sh <sha> → health check.
# Repository variables come from `terraform -chdir=infra/ec2-terraform output github_actions_variables`.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-ec2
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write # GitHub OIDC → AWS role; no AWS keys stored in GitHub

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  TAG: ${{ github.sha }}

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  build:
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.EC2_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Build images in CodeBuild (from GitHub) and push to ECR
        run: |
          set -euo pipefail
          # --source-version pins the build to the commit that just passed CI.
          BUILD_ID=$(aws codebuild start-build \
            --project-name "${{ vars.CODEBUILD_PROJECT }}" \
            --source-version "$TAG" \
            --environment-variables-override "name=IMAGE_TAG,value=$TAG,type=PLAINTEXT" \
            --query build.id --output text)
          echo "CodeBuild: $BUILD_ID"
          echo "Console: https://${AWS_REGION}.console.aws.amazon.com/codesuite/codebuild/projects/${{ vars.CODEBUILD_PROJECT }}/build/${BUILD_ID//:/%3A}"
          while true; do
            read -r STATUS PHASE < <(aws codebuild batch-get-builds --ids "$BUILD_ID" \
              --query 'builds[0].[buildStatus,currentPhase]' --output text)
            echo "$(date -u +%T) $STATUS $PHASE"
            [ "$STATUS" != "IN_PROGRESS" ] && break
            sleep 15
          done
          if [ "$STATUS" != "SUCCEEDED" ]; then
            GROUP=$(aws codebuild batch-get-builds --ids "$BUILD_ID" --query 'builds[0].logs.groupName' --output text)
            STREAM=$(aws codebuild batch-get-builds --ids "$BUILD_ID" --query 'builds[0].logs.streamName' --output text)
            echo "---- last CodeBuild log lines ----"
            aws logs get-log-events --log-group-name "$GROUP" --log-stream-name "$STREAM" --limit 60 \
              --query 'events[].message' --output text || true
            exit 1
          fi

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ vars.APP_URL }}
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.EC2_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Deploy on EC2 via SSM Run Command
        run: |
          set -euo pipefail
          INSTANCE="${{ vars.EC2_INSTANCE_ID }}"
          CMD_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE" \
            --document-name AWS-RunShellScript \
            --comment "Deploy ${TAG:0:12}" \
            --timeout-seconds 900 \
            --parameters "commands=[\"/opt/cloudops/deploy.sh $TAG\"],executionTimeout=[\"900\"]" \
            --query Command.CommandId --output text)
          echo "SSM command: $CMD_ID"
          for _ in $(seq 1 90); do
            STATUS=$(aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE" \
              --query Status --output text 2>/dev/null || echo Pending)
            case "$STATUS" in Pending|InProgress|Delayed) sleep 10 ;; *) break ;; esac
          done
          echo "---- deploy output ----"
          aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE" \
            --query '[StandardOutputContent,StandardErrorContent]' --output text
          test "$STATUS" = "Success"

      - name: Health check through the public HTTPS URL
        run: |
          for _ in $(seq 1 20); do
            if curl -fsS "${{ vars.APP_URL }}/api/health"; then echo; exit 0; fi
            sleep 6
          done
          echo "App did not become healthy at ${{ vars.APP_URL }}" && exit 1
